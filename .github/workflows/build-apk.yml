name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dipendenze
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Prepara APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GymTrack.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GymTrack v1.0.${{ github.run_number }}
          files: GymTrack.apk
          body: |
            APK Android di GymTrack.
            Installazione: scarica il file, apri il .apk sul telefono e consenti l'installazione da origini sconosciute.

  build-web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dipendenze
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href "/gym-tracker/"

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Attendi artefatto Pages
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null | grep -q .; then
              echo "artefatto github-pages visibile"
              exit 0
            fi
            sleep 10
          done
          echo "artefatto github-pages non trovato"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios:
    name: iOS (IPA)
    needs: build-android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dipendenze
        run: flutter pub get

      - name: Build iOS (senza firma)
        run: flutter build ios --release --no-codesign

      - name: Prepara IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -rq GymTrack.ipa Payload
          mv GymTrack.ipa ${{ github.workspace }}

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GymTrack v1.0.${{ github.run_number }}
          files: GymTrack.ipa
          body: |
            IPA iOS (non firmato) di GymTrack.
            Installazione: serve un computer con AltStore o Sideloadly, vedi README.
