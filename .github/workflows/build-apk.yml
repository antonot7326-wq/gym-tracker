name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dipendenze
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Prepara APK
        run: cp build/app/outputs/flutter-apk/app-release.apk GymTrack.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GymTrack v1.0.${{ github.run_number }}
          files: GymTrack.apk
          body: |
            APK Android di GymTrack.
            Installazione: scarica il file, apri il .apk sul telefono e consenti l'installazione da origini sconosciute.
